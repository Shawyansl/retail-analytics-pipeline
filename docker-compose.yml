services:
  db:
    image: postgres:15
    container_name: retail_postgres
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/01_create_schema.sql:/docker-entrypoint-initdb.d/01_create_schema.sql:ro
      - ./sql/02_create_analytics_views.sql:/docker-entrypoint-initdb.d/02_create_analytics_views.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  etl_app:
    build: .
    container_name: retail_etl_pipeline
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - .:/app

volumes:
  pgdata:
